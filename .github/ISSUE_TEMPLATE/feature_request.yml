name: Feature request
description: Suggest a language feature, CLI command or docs improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Cluub syntax or behaviour
      render: text
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
