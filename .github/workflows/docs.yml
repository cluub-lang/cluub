name: Docs
# Builds the documentation and publishes it to https://cluub-lang.github.io/
# by pushing the built site to the cluub-lang/cluub-lang.github.io repository, which GitHub Pages serves.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs
  cancel-in-progress: true
jobs:
  publish:
    if: github.repository == 'cluub-lang/cluub'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - name: Publish to cluub-lang/cluub-lang.github.io
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git clone --depth 1 git@github.com:cluub-lang/cluub-lang.github.io.git site
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R docs/.vitepress/dist/. site/
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Docs unchanged"; exit 0; fi
          git commit -m "Publish docs from cluub-lang/cluub@${GITHUB_SHA::7}"
          git push origin HEAD
